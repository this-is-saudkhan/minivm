name: Lint

on:
  push:
    branches: ["**"]
    paths:
      - "minivm-takehome/**"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "minivm-takehome/**"
      - ".github/workflows/lint.yml"

defaults:
  run:
    working-directory: minivm-takehome

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check .
